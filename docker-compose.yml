x-app: &app
  image: nebus-payments:local
  build: .
  init: true
  environment: &app-environment
    DATABASE_URL: postgresql+asyncpg://payment_user:${POSTGRES_PASSWORD:-payment_password}@postgres:5432/payments_db
    RABBITMQ_URL: amqp://payment_user:${RABBITMQ_PASSWORD:-payment_password}@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_password}
      POSTGRES_DB: payments_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payments_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payment_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-payment_password}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-environment
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  consumer:
    <<: *app
    command: ["python", "-m", "payments.consumer"]
    restart: unless-stopped
    stop_grace_period: 70s
    environment:
      <<: *app-environment
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-5}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
