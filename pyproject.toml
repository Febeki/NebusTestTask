[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nebus-payments"
version = "0.1.0"
description = "Asynchronous payment processing service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "faststream[rabbit]>=0.6,<0.7",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
